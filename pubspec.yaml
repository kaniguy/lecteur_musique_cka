name: lecteur_musique_cka
description: "Musique CKA — lecteur de la musique du téléphone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_service: ^0.18.19
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Polices recommandées par le skill ui-ux-pro-max (musique) : Poppins pour
  # le texte, Righteous pour les grands titres. Licence OFL (assets/fonts).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 900
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf

# Icône de l'app : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#A93BC9"
  adaptive_icon_foreground: "assets/logo_premier_plan.png"
